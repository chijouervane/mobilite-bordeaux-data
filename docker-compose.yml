# Pile locale : les identifiants viennent du fichier .env (voir .env.example)
services:
  # Entrepôt de données relationnel (modèle en étoile)
  postgres:
    image: postgres:16
    container_name: mobilite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Vérifie que Postgres accepte les connexions ($$ = variable lue dans le conteneur)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Stockage des données brutes en JSON (réponses d'API)
  mongo:
    image: mongo:7
    container_name: mobilite-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Stockage objet compatible S3 (fichiers bruts, ex. GTFS) ; console web sur :9001
  rustfs:
    image: rustfs/rustfs:latest
    container_name: mobilite-rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

# Volumes nommés : les données survivent à "docker compose down" (pas à "down -v")
volumes:
  postgres_data:
  mongo_data:
  rustfs_data:
